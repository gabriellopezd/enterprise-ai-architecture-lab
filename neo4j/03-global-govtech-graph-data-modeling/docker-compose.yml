services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-modeling-pow-003
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j-local-pow}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_modeling_pow003_data:/data

volumes:
  neo4j_modeling_pow003_data:

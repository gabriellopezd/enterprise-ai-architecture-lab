name: Neo4j PoW Validation

on:
  pull_request:
    paths:
      - 'neo4j/**'
      - '.github/workflows/neo4j-pow.yml'
  push:
    branches:
      - main
    paths:
      - 'neo4j/**'
      - '.github/workflows/neo4j-pow.yml'

jobs:
  validate-neo4j-pow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate PoW
        working-directory: neo4j/01-enterprise-architecture-knowledge-graph
        env:
          NEO4J_PASSWORD: neo4j-local-pow
        run: |
          chmod +x scripts/*.sh
          ./scripts/run.sh

      - name: Print validation evidence
        if: always()
        working-directory: neo4j/01-enterprise-architecture-knowledge-graph
        run: |
          if [ -f evidence/runtime-validation.txt ]; then
            cat evidence/runtime-validation.txt
          fi
